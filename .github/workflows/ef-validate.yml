# Validates the EF engineering-file state (.engineering/) on every push to
# master, so active-content changes that bypass the CHG-backed workflow (see
# AGENTS.md § Engineering Workflow) fail here.
#
# EF validates one commit boundary at a time: transition scope requires the
# proposed commit's first parent to be exactly the baseline, and bootstrap
# scope requires the candidate's first parent to be the integration ref's
# tip. The job therefore walks the pushed range along the first-parent chain,
# and for each commit touching .engineering/ rewinds the runner's local
# master ref to that commit's parent and validates the single step (bootstrap
# scope when the parent is EF-free, transition scope otherwise), finishing
# with a snapshot check of the pushed tip. Falls back to snapshot-only when
# no usable baseline exists (force push, manual dispatch).
name: EF validation

on:
  push:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: validate EF state
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          snapshot_tip() {
            git checkout --detach "$SHA"
            git update-ref refs/heads/master "$SHA"
            pnpm exec ef validate --scope snapshot --strict --format json --no-input
          }

          if [ "$EVENT_NAME" != "push" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable baseline commit; running snapshot validation only"
            snapshot_tip
            exit "$?"
          fi

          for C in $(git rev-list --reverse --first-parent "$BEFORE..$SHA"); do
            if ! PARENT=$(git rev-parse -q --verify "$C^"); then
              echo "::group::bootstrap-validate root commit $C"
              git checkout --detach "$C"
              git update-ref -d refs/heads/master
              pnpm exec ef validate --scope bootstrap --proposed "$C" --strict --format json --no-input
              echo "::endgroup::"
              continue
            fi
            if git diff --quiet "$PARENT" "$C" -- .engineering; then
              continue # no EF change in this step
            fi
            git checkout --detach "$C"
            git update-ref refs/heads/master "$PARENT"
            if git cat-file -e "$PARENT:.engineering/ef.yaml" 2>/dev/null; then
              echo "::group::transition-validate $PARENT -> $C"
              pnpm exec ef validate --scope transition --baseline "$PARENT" --proposed "$C" --strict --format json --no-input
            else
              echo "::group::bootstrap-validate $C"
              pnpm exec ef validate --scope bootstrap --proposed "$C" --strict --format json --no-input
            fi
            echo "::endgroup::"
          done

          echo "::group::snapshot-validate pushed tip $SHA"
          snapshot_tip
          echo "::endgroup::"
