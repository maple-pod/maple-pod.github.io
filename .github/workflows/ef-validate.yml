# Validates the EF engineering-file state (.engineering/) on every push to
# master. Runs `ef validate --scope transition` between the pre-push tip and
# the pushed commit, so active-content changes that bypass the CHG-backed
# workflow (see AGENTS.md § Engineering Workflow) fail here.
#
# Transition scope requires the integration ref (refs/heads/master) to still
# point at the baseline, so the job rewinds the runner's local master ref and
# holds the proposed state on a detached HEAD. A push whose baseline is
# EF-free (the adoption push) is validated as bootstrap + remainder
# transition instead. Falls back to snapshot scope when no usable baseline
# exists (force push, manual dispatch).
name: EF validation

on:
  push:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: validate EF state
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable baseline commit; running snapshot validation instead"
            pnpm exec ef validate --scope snapshot --strict --format json --no-input
            exit "$?"
          fi

          if git cat-file -e "$BEFORE:.engineering/ef.yaml" 2>/dev/null; then
            # Normal case: baseline holds an authoritative EF snapshot.
            git checkout --detach "$SHA"
            git update-ref refs/heads/master "$BEFORE"
            pnpm exec ef validate --scope transition --baseline "$BEFORE" --proposed "$SHA" --strict --format json --no-input
            exit "$?"
          fi

          # Baseline is EF-free: this push introduces EF. Validate the
          # bootstrap commit itself, then the remaining commits (if any) as a
          # transition on top of it.
          BOOT=$(git log --reverse --diff-filter=A --format=%H "$BEFORE..$SHA" -- .engineering/ef.yaml | head -n 1)
          if [ -z "$BOOT" ]; then
            echo "Neither baseline nor push contains .engineering/ef.yaml; running snapshot validation"
            pnpm exec ef validate --scope snapshot --strict --format json --no-input
            exit "$?"
          fi
          git checkout --detach "$BOOT"
          git update-ref refs/heads/master "$BEFORE"
          pnpm exec ef validate --scope bootstrap --proposed "$BOOT" --strict --format json --no-input
          if [ "$BOOT" != "$SHA" ]; then
            git checkout --detach "$SHA"
            git update-ref refs/heads/master "$BOOT"
            pnpm exec ef validate --scope transition --baseline "$BOOT" --proposed "$SHA" --strict --format json --no-input
          fi
